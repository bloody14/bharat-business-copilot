services:
  db:
    image: postgres:16-alpine
    container_name: bharat-business-copilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bharat_copilot
      POSTGRES_USER: bharat
      POSTGRES_PASSWORD: bharat_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharat -d bharat_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://bharat:bharat_local_dev@db:5432/bharat_copilot
      FRONTEND_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
